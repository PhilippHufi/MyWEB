services:
  - type: web
    name: myweb-dashboard
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: personal-dashboard-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/prod.db
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        sync: false
      - key: DEFAULT_USERNAME
        sync: false
      - key: DEFAULT_USER_PASSWORD
        sync: false
      - key: TMDB_API_KEY
        value: ""
      - key: NEWS_API_KEY
        value: ""
      - key: TRAFFIC_RSS_URL
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: WEATHER_LAT
        value: 48.3069
      - key: WEATHER_LON
        value: 14.2858
      - key: WEATHER_LABEL
        value: Linz, Oberoesterreich
